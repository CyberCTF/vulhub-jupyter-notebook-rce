# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Jupyter Notebook unauthenticated access (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's jupyter/notebook-rce, vendored in app/: the published image
# vulhub/jupyter-notebook:5.2.2 started with an empty token, as Vulhub's compose file does (build/jupyter/).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-jupyter-notebook-rce

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.235.0/24, internet: false}

machines:
  jupyter:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8888
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/jupyter

checks:
  - name: Jupyter answers
    http: http://jupyter:8888/tree
    wait: 120
  - name: the API is Notebook 5.2.2 and needs no token
    script: checks/api.sh
    wait: 60

message: |
  Jupyter Notebook 5.2.2 answers at {{ machines.jupyter.ports.web.url }}.
  Nobody set a token.
